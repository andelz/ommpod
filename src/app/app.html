
  @if (updateService.updateAvailable()) {
    <div class="update-banner" role="alert">
      <span>{{ 'home.update.message' | translate }}</span>
      <button class="update-btn" (click)="updateService.reload()">{{ 'home.update.reload' | translate }}</button>
    </div>
  }

  @if (!isNowPlaying()) {

    <header>
      <a routerLink="/home" class="brand">P<em>O</em>D</a>
    </header>


    <nav>

        @for (item of navItems; track item.route) {
          <a
            class="nav-btn"
            [routerLink]="item.route"
            routerLinkActive="active"
            [ommTooltip]="item.labelKey | translate"
            tipPosition="top"
            [attr.aria-label]="item.labelKey | translate"
          >
            <lucide-icon [size]="18" [img]="item.icon" />
          </a>
        }

    </nav>
  }

  <main class="main">
    <router-outlet />
  </main>

  @if (!isNowPlaying()) {
    <app-player-bar />
  }
