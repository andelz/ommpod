<div class="pod-view">
  <div class="search-bar">
    <span class="prompt">>&nbsp;</span>
    <input
      type="search"
      [ngModel]="query()"
      (ngModelChange)="query.set($event)"
      (keydown)="onKeydown($event)"
      [placeholder]="'search.placeholder' | translate"
      autocomplete="off"
      spellcheck="false"
    />
    <button class="icon" (click)="search()" [disabled]="loading()">
      {{ loading() ? ('search.loading' | translate) : ('search.button' | translate) }}
    </button>
  </div>

  <div class="pod-scroll results">
    @for (p of results(); track p.id) {
      <div class="pod-row" (click)="select(p)" tabindex="0" (keydown.enter)="select(p)">
        @if (p.artworkUrl) {
          <img class="pod-artwork" [src]="p.artworkUrl" [alt]="p.title" loading="lazy" />
        } @else {
          <div class="pod-artwork pod-artwork-placeholder"></div>
        }
        <div class="pod-row-main">
          <span class="pod-row-title">{{ p.title }}</span>
          <span class="pod-row-meta dim">{{ p.author }} &middot; {{ p.genre }} &middot; {{ 'search.episodes' | translate: { count: p.episodeCount } }}</span>
        </div>
        <button class="sub-btn icon pod-row-action" (click)="toggleSubscribe(p, $event)"
          [attr.aria-label]="library.isSubscribed(p.id) ? ('search.unsubscribe' | translate) : ('search.subscribe' | translate)">
          {{ library.isSubscribed(p.id) ? '[-]' : '[+]' }}
        </button>
      </div>
    }
    @if (!loading() && results().length === 0 && query()) {
      <div class="pod-empty dim">{{ 'search.empty' | translate }}</div>
    }
  </div>
</div>
